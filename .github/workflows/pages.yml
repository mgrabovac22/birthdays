name: Deploy Wishcraft to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "3,23 0 * * *"
      timezone: "Europe/Zagreb"
  workflow_dispatch:
    inputs:
      test_cards:
        description: Publish a fictional card for today
        type: boolean
        default: false

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: npm ci
      - run: npm test
      - run: npm run build:site
      - name: Prepare today's test card
        if: inputs.test_cards == true
        run: node scripts/publish-today.mjs --sample --out dist/today.json
      - name: Prepare today's public greeting
        if: inputs.test_cards != true
        env:
          BIRTHDAY_01: ${{ secrets.BIRTHDAY_01 }}
          BIRTHDAY_02: ${{ secrets.BIRTHDAY_02 }}
